map $http_upgrade $florrclone_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8088 default_server;
    listen [::]:8088 default_server;
    server_name _;
    client_max_body_size 8k;
    gzip on;
    gzip_comp_level 2;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

    location ~ (^|/)\. { return 404; }
    location ~ ^/(server|data|node_modules|deploy|test-results)(/|$) { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $florrclone_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        tcp_nodelay on;
    }
}
